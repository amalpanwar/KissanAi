name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax compile check
        run: |
          python -m compileall app scripts streamlit_app.py

      - name: Validate required deploy files
        run: |
          test -f Dockerfile
          test -f docker-compose.yml
          test -f .streamlit/config.toml
          test -f requirements.txt

      - name: Install test dependencies
        run: pip install pandas==2.2.3 PyYAML==6.0.2 streamlit==1.45.1 scikit-learn==1.5.2 pypdf==4.3.1

      - name: Agent and refresh regression tests
        run: python -m unittest discover -s tests -v

      - name: Set up Node for chat browser tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium

      - name: In-chat autocomplete browser tests
        run: node tests/chat_composer_browser.cjs
