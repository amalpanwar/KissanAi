name: Refresh Agmarknet records
on:
  push:
    branches: ['codex/agentic-agmarknet-refresh']
    paths: ['data/updates/**']
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # 06:30 IST
permissions:
  contents: write
concurrency:
  group: agmarknet-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 PyYAML==6.0.2
      - name: Import verified September snapshot
        if: github.event_name == 'push'
        run: python scripts/import_market_snapshot.py data/updates/agmarknet_2026-09-17_2026-09-18.csv
      - name: Fetch and validate official records
        if: github.event_name != 'push' 
        env:
          AGMARKNET_MODE: auto
          AGMARKNET_ALL_DISTRICTS: '1'
          AGMARKNET_LOOKBACK_DAYS: '3'
          AGMARKNET_RUN_TIMEOUT_SEC: '480'
        run: python scripts/agmarknet_daily_refresh.py
      - name: Upload refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agmarknet-refresh-diagnostics
          path: |
            data/raw/live/agmarknet_refresh_status.json
            data/raw/live/agmarknet_fetch_summary.json
            data/raw/live/agmarknet_failures.csv
          retention-days: 7
      - name: Persist validated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw/live/agmarknet_report.csv data/raw/live/agmarknet_refresh_status.json
          git add data/processed/kisaanai.db data/processed/agmarknet_catalog.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official Agmarknet market records'
            git push
          fi
